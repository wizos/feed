proxies:
  - name: Office-Checkin
    type: vless
    server: cf-tunnel.chuci.xyz
    port: 443
    uuid: 0fc8557a-598b-43fe-a3db-c4fa949692ed
    tls: true
    udp: true
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vless-ws
      headers:
        Host: cf-tunnel.chuci.xyz

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Office-Checkin

rules:
  - MATCH,Proxy
