proxies:
  - name: Office-Checkin
    type: vless
    server: coral-gates-henry-peterson.trycloudflare.com
    port: 443
    uuid: b71e108d-be48-4971-a55e-0ddc4c49081b
    tls: true
    udp: true
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vless-ws
      headers:
        Host: coral-gates-henry-peterson.trycloudflare.com

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Office-Checkin
      - DIRECT

rules:
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
