proxies:
  - name: Office-Checkin
    type: vless
    server: pathology-hardware-watt-choir.trycloudflare.com
    port: 443
    uuid: dda5434a-bb65-4311-bdf4-87f3af21e86b
    tls: true
    udp: true
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vless-ws
      headers:
        Host: pathology-hardware-watt-choir.trycloudflare.com

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Office-Checkin
      - DIRECT

rules:
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
