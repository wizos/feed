mixed-port: 7890
allow-lan: false
mode: "rule"
log-level: "info"
external-controller: "127.0.0.1:9999"
dns:
  enable: true
  listen: "0.0.0.0:53"
  ipv6: false
  default-nameserver:
  - "223.5.5.5"
  - "114.114.114.114"
  nameserver:
  - "223.5.5.5"
  - "114.114.114.114"
  - "119.29.29.29"
  - "180.76.76.76"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
  - "*.lan"
  - "*.localdomain"
  - "*.example"
  - "*.invalid"
  - "*.localhost"
  - "*.test"
  - "*.local"
  - "*.home.arpa"
  - "router.asus.com"
  - "localhost.sec.qq.com"
  - "localhost.ptlogin2.qq.com"
  - "+.msftconnecttest.com"
tun:
  enable: true
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - "114.114.114.114"
  - "180.76.76.76"
  - "119.29.29.29"
  - "223.5.5.5"
  - "8.8.8.8"
  - "8.8.4.4"
  - "1.1.1.1"
  - "1.0.0.1"
proxies:
  - name: Office-Checkin
    type: vless
    server: defense-meaningful-blogs-biblical.trycloudflare.com
    port: 443
    uuid: dda5434a-bb65-4311-bdf4-87f3af21e86b
    tls: true
    udp: true
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /vless-ws
      headers:
        Host: defense-meaningful-blogs-biblical.trycloudflare.com

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Office-Checkin

rules:
  - MATCH,Proxy
